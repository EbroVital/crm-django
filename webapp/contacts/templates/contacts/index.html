{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon carnet d'adresse</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="navbar">
        <h1 class="text-white"> Mon carnet d'adresse</h1>
    </div>

    <div class="container">
        <div class="row g-3">
            {% for user in users %}
                <div class="col-lg-4 col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h2 class="card-title">{{ user.full_name }}</h2>
                            <p class="card-text">
                                <p class="text-primary">{{ user.phone_number }}</p>
                                <p>{{ user.addresse }}</p>
                            </p>
                            <form action="{% url 'delete-contact' %}" method="post">
                                {% csrf_token %}
                                <input type="hidden" name="first_name" value="{{user.first_name}}">
                                <input type="hidden" name="last_name" value="{{user.last_name}}">
                                <button type="submit" class="btn btn-danger">Supprimer</button>
                            </form>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>

        <div class="row mt-5">
            <form action="{% url 'add-contact' %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="first_name" class="form-label">Nom :</label>
                    <input type="text" id="first_name" name="first_name" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="last_name" class="form-label">Prénom :</label>
                    <input type="text" id="last_name" name="last_name" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="addresse" class="form-label">Addresse :</label>
                    <textarea name="addresse" id="addresse" rows="3" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                     <label for="phone_number" class="form-label">Téléphone :</label>
                    <input type="text" id="phone_number" name="phone_number" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary">Ajouter</button>
            </form>
        </div>

    </div>


</body>
</html>
